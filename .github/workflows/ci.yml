name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and build v0.3
        run: bash cloudflare-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: project-sovereign-v0.3-dist
          path: dist
          if-no-files-found: error
