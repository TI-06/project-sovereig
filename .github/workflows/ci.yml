name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decode, verify and build release
        run: bash cloudflare-build.sh

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: project-sovereign-dist
          path: dist
          if-no-files-found: error
